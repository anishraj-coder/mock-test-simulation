name: Auto Update Test Manifest

on:
  push:
    paths:
      - 'sample_test_accenture/**'

permissions:
  contents: write

jobs:
  sync-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update manifest.json
        run: |
          node -e "
          const fs = require('fs');
          const path = './sample_test_accenture';
          const files = fs.readdirSync(path).filter(f => f.endsWith('.json') && f !== 'manifest.json');
          fs.writeFileSync(path + '/manifest.json', JSON.stringify(files, null, 2) + '\n');
          console.log('Updated manifest with:', files);
          "

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sample_test_accenture/manifest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update test manifest [skip ci]" && git push)
